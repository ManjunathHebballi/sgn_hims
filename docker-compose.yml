# Fixed project name so this stack never merges with another hospital's
# stack on the same server, whatever folder it is cloned into.
name: sgn_hospital

services:
  # PHP Apache Application
  web:
    build: .
    container_name: sgn_hospital_web
    ports:
      - "${WEB_PORT:-3111}:1111"
    volumes:
      - ./:/var/www/html:rw
      - ./docker-data/sessions:/var/www/sessions:rw
    environment:
      - TZ=Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital_network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: sgn_hospital_db
    ports:
      # Host access only (backups, SSH tunnel); not exposed to the internet.
      - "127.0.0.1:${DB_HOST_PORT:-3112}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      # Persistent database storage on physical machine
      - ./docker-data/mysql:/var/lib/mysql
      # Initial database dump(s), imported only on first start (empty data dir)
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - hospital_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    command: --default-authentication-plugin=mysql_native_password --sql-mode="no_engine_substitution"

  # phpMyAdmin for database management (optional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sgn_hospital_phpmyadmin
    ports:
      - "${PMA_PORT:-3113}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 500M
    depends_on:
      - db
    networks:
      - hospital_network
    restart: unless-stopped

networks:
  hospital_network:
    driver: bridge
